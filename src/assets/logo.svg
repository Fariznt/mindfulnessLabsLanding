<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <style>
      .bulb-fill { fill: #FFB800; }
      .bulb-stroke { stroke: #FFB800; stroke-width: 2; fill: none; }
    </style>
  </defs>
  
  <!-- Sun rays -->
  <line class="bulb-stroke" x1="50" y1="5" x2="50" y2="15"/>
  <line class="bulb-stroke" x1="73" y1="12" x2="68" y2="20"/>
  <line class="bulb-stroke" x1="88" y1="27" x2="80" y2="32"/>
  <line class="bulb-stroke" x1="95" y1="50" x2="85" y2="50"/>
  <line class="bulb-stroke" x1="88" y1="73" x2="80" y2="68"/>
  <line class="bulb-stroke" x1="27" y1="12" x2="32" y2="20"/>
  <line class="bulb-stroke" x1="12" y1="27" x2="20" y2="32"/>
  <line class="bulb-stroke" x1="5" y1="50" x2="15" y2="50"/>
  <line class="bulb-stroke" x1="12" y1="73" x2="20" y2="68"/>
  
  <!-- Light bulb body -->
  <circle class="bulb-stroke" cx="50" cy="45" r="18"/>
  
  <!-- Brain inside bulb -->
  <path class="bulb-fill" d="M 45,38 Q 42,40 42,43 Q 42,46 45,48 Q 48,50 50,48 Q 52,50 55,48 Q 58,46 58,43 Q 58,40 55,38 Q 52,36 50,38 Q 48,36 45,38 Z"/>
  <path class="bulb-stroke" d="M 46,40 Q 44,42 46,44 M 50,40 L 50,44 M 54,40 Q 56,42 54,44"/>
  
  <!-- Bulb base -->
  <rect class="bulb-stroke" x="45" y="63" width="10" height="3"/>
  <rect class="bulb-stroke" x="45" y="66" width="10" height="3"/>
  <rect class="bulb-stroke" x="45" y="69" width="10" height="3"/>
  
  <!-- Bottom tip -->
  <path class="bulb-fill" d="M 47,72 L 50,82 L 53,72 Z"/>
</svg>
